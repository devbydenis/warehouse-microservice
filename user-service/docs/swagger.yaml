basePath: /api/v1
definitions:
  request.AssignUserToRoleRequest:
    properties:
      role_id:
        type: integer
      user_id:
        type: integer
    required:
    - role_id
    - user_id
    type: object
  request.CreateRoleRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  request.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
      photo:
        type: string
    required:
    - email
    - name
    - password
    - phone
    - photo
    type: object
  request.GetAllUsersRequest:
    properties:
      limit:
        maximum: 100
        minimum: 1
        type: integer
      page:
        minimum: 1
        type: integer
      search:
        type: string
      sortBy:
        enum:
        - id
        - name
        - email
        - created_at
        type: string
      sortOrder:
        enum:
        - asc
        - desc
        type: string
    type: object
  request.LoginRequest:
    properties:
      email:
        example: admin@gmail.com
        type: string
      password:
        example: password123
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
host: user-service:8081
